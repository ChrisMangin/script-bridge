<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptBridge</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div id="app">
    <header>
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
            <h1>ScriptBridge</h1>
        </div>
        <nav class="header-nav">
            <a class="nav-link active" data-page="scripts">Scripts</a>
            <a class="nav-link" data-page="settings">Settings</a>
            <a class="nav-link" data-page="guide">Guide</a>
            <a class="nav-link" data-page="companion">
                <span class="companion-indicator" id="nav-companion-dot"></span> Companion
            </a>
        </nav>
        <div class="header-actions">
            <button class="btn btn-primary" id="btn-new-script">+ New Script</button>
        </div>
    </header>

    <!-- SCRIPTS PAGE -->
    <div id="page-scripts" class="page active">
        <div class="toolbar">
            <div class="tabs">
                <button class="tab active" data-tab="all">All</button>
                <button class="tab" data-tab="browser">Browser</button>
                <button class="tab" data-tab="external">External</button>
            </div>
            <div class="toolbar-right">
                <input type="text" id="search-input" placeholder="Search... (Ctrl+F)" class="search-box">
                <label class="regex-toggle"><input type="checkbox" id="search-regex"> <span>.*</span></label>
                <button class="btn" id="btn-import">Import</button>
                <button class="btn" id="btn-export">Export</button>
            </div>
        </div>
        <main id="script-list" class="script-grid"></main>
    </div>

    <!-- SETTINGS PAGE -->
    <div id="page-settings" class="page">
        <div id="settings-container"></div>
    </div>

    <!-- GUIDE PAGE -->
    <div id="page-guide" class="page">
        <div id="guide-container"></div>
    </div>

    <!-- COMPANION PAGE -->
    <div id="page-companion" class="page">
        <div id="companion-container"></div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">New Script</h2>
                <button class="btn-close" id="btn-modal-close">&times;</button>
            </div>
            <form id="script-form">
                <input type="hidden" id="script-id">
                <div class="form-row">
                    <div class="form-group"><label>Name</label><input type="text" id="script-name" required placeholder="My Script"></div>
                    <div class="form-group"><label>Language</label><select id="script-language"><option value="javascript">JavaScript</option><option value="typescript">TypeScript</option><option value="python">Python</option><option value="rust">Rust</option><option value="c">C</option><option value="sql">SQL</option><option value="vbscript">VBScript</option><option value="shell">Shell (bash)</option><option value="cmd">CMD</option><option value="powershell">PowerShell</option></select></div>
                    <div class="form-group"><label>Category</label><select id="script-category"><option value="browser">Browser (injected)</option><option value="external">External (local)</option></select></div>
                </div>
                <div class="form-group"><label>Description</label><input type="text" id="script-desc" placeholder="What does this script do?"></div>
                <div id="browser-options" class="form-group">
                    <label>URL Match Patterns <span class="hint">(one per line)</span></label>
                    <textarea id="script-patterns" rows="2" placeholder="*://*/*"></textarea>
                    <label>Run At</label>
                    <select id="script-runat"><option value="document-idle">document-idle</option><option value="document-start">document-start</option><option value="document-end">document-end</option></select>
                </div>
                <div id="external-options" class="form-group hidden">
                    <label>Trigger</label>
                    <select id="script-trigger"><option value="manual">Manual</option></select>
                    <div id="external-locked" class="locked-notice hidden">
                        <p>External scripts require the companion app.</p>
                    </div>
                </div>
                <div class="form-group"><label>Tags <span class="hint">(comma separated)</span></label><input type="text" id="script-tags" placeholder="utility, automation"></div>
                <div class="form-group"><label>Code</label><textarea id="script-code" rows="16" class="code-editor" spellcheck="false" placeholder="// Your code here..."></textarea></div>
                <div class="form-actions">
                    <button type="button" class="btn" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Run Output Modal -->
    <div id="run-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header"><h2>Run Output</h2><button class="btn-close" id="btn-run-close">&times;</button></div>
            <div class="run-output">
                <div id="run-status"></div>
                <pre id="run-stdout"></pre>
                <pre id="run-stderr" class="stderr"></pre>
            </div>
        </div>
    </div>
</div>
<script src="lib/hljs.min.js"></script>
<script src="lib/hljs-powershell.min.js"></script>
<script src="lib/hljs-dos.min.js"></script>
<script src="syntax-highlight.js"></script>
<script src="companion-client.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
