<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptBridge - Install Script</title>
<link rel="stylesheet" href="dashboard.css">
<style>
body { background: var(--bg); color: var(--text); padding: 0; margin: 0; min-height: 100vh; }
.install-container { max-width: 800px; margin: 40px auto; padding: 0 24px; }
.install-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.install-header svg { color: var(--accent); }
.install-header h1 { font-size: 1.4rem; margin: 0; }
.meta-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
.meta-card h2 { margin: 0 0 4px; font-size: 1.1rem; }
.meta-card .desc { color: var(--dim); font-size: 0.88rem; margin-bottom: 14px; }
.meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 0.84rem; }
.meta-grid .key { color: var(--dim); font-weight: 500; }
.meta-grid .val { word-break: break-all; }
.permissions-warn { background: #2a1f00; border: 1px solid #6b4f00; border-radius: 8px; padding: 14px; margin-bottom: 20px; }
.permissions-warn h4 { margin: 0 0 8px; color: #ffc107; font-size: 0.9rem; }
.permissions-warn ul { margin: 0; padding-left: 20px; font-size: 0.82rem; color: var(--dim); line-height: 1.7; }
.code-preview { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; }
.code-preview summary { padding: 12px 16px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
.code-preview pre { margin: 0; padding: 16px; font-size: 0.78rem; line-height: 1.5; max-height: 400px; overflow: auto; border-top: 1px solid var(--border); font-family: var(--mono); }
.diff-view { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; }
.diff-view summary { padding: 12px 16px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
.diff-view pre { margin: 0; padding: 16px; font-size: 0.78rem; line-height: 1.5; max-height: 400px; overflow: auto; border-top: 1px solid var(--border); font-family: var(--mono); }
.diff-add { background: #1a3a1a; color: #6fdc6f; }
.diff-del { background: #3a1a1a; color: #dc6f6f; }
.diff-ctx { color: var(--dim); }
.actions { display: flex; gap: 12px; align-items: center; }
.actions .btn { padding: 10px 24px; font-size: 0.9rem; border-radius: 6px; cursor: pointer; border: none; font-weight: 500; }
.btn-install { background: var(--accent); color: #fff; }
.btn-install:hover { opacity: 0.9; }
.btn-cancel { background: var(--surface); color: var(--text); border: 1px solid var(--border) !important; }
.btn-cancel:hover { background: var(--surface2); }
.update-badge { display: inline-block; background: #ffc107; color: #000; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
#status-msg { margin-top: 16px; font-size: 0.88rem; padding: 10px 14px; border-radius: 6px; display: none; }
#status-msg.success { display: block; background: #1a3a1a; color: #6fdc6f; border: 1px solid #2d5a2d; }
#status-msg.error { display: block; background: #3a1a1a; color: #dc6f6f; border: 1px solid #5a2d2d; }
</style>
</head>
<body>
<div class="install-container">
    <div class="install-header">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
        <h1>ScriptBridge</h1>
    </div>
    <div id="install-content"><p style="color:var(--dim)">Loading script...</p></div>
</div>
<script src="script-url-policy.js"></script>
<script src="install.js"></script>
</body>
</html>
