<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
:root { --bg:#1a1d27; --surface:#242836; --border:#2e3345; --text:#e4e7ef; --dim:#8b92a8; --accent:#6c8cff; --green:#4cdf8b; --red:#ff6b6b; --purple:#b07cff; }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:320px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
.header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.header h2 { font-size:0.92rem; display:flex; align-items:center; gap:8px; }
.status { width:8px; height:8px; border-radius:50%; }
.status.online { background:var(--green); }
.status.offline { background:var(--red); }
.status.ext-only { background:var(--accent); }
.actions { padding:10px 16px; display:flex; gap:6px; border-bottom:1px solid var(--border); }
.btn { padding:5px 10px; border:1px solid var(--border); border-radius:5px; background:var(--surface); color:var(--text); font-size:0.76rem; cursor:pointer; text-decoration:none; text-align:center; }
.btn:hover { border-color:var(--accent); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; flex:1; }
.script-list { max-height:300px; overflow-y:auto; }
.script-item { padding:8px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.script-item:hover { background:var(--surface); }
.script-item.disabled { opacity:0.5; }
.script-item.disabled .script-name { text-decoration:line-through; }
.badge-off { background:#301a1a; color:var(--red); }
.script-info { flex:1; min-width:0; }
.script-name { font-size:0.8rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.script-meta { font-size:0.68rem; color:var(--dim); margin-top:2px; display:flex; gap:6px; align-items:center; }
.badge { display:inline-block; padding:1px 5px; border-radius:3px; font-size:0.62rem; font-weight:500; }
.badge-browser { background:#1a2640; color:var(--accent); }
.badge-external { background:#261a40; color:var(--purple); }
.toggle { width:28px; height:15px; border-radius:8px; background:#3a2020; border:1px solid #5a3030; position:relative; cursor:pointer; flex-shrink:0; }
.toggle.on { background:#1a3a20; border-color:#2a5a30; }
.toggle::after { content:''; width:11px; height:11px; border-radius:50%; background:var(--red); opacity:0.8; position:absolute; top:1px; left:1px; transition:0.2s; }
.toggle.on::after { left:14px; background:var(--green); opacity:1; }
.empty { padding:20px; text-align:center; color:var(--dim); font-size:0.8rem; }
.companion-status { padding:8px 16px; border-top:1px solid var(--border); font-size:0.72rem; color:var(--dim); display:flex; align-items:center; gap:6px; }
.companion-status a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="header">
    <h2><span class="status ext-only" id="status-dot"></span> ScriptBridge</h2>
    <span id="script-count" style="font-size:0.72rem;color:var(--dim)"></span>
</div>
<div class="actions">
    <a class="btn btn-primary" id="btn-dashboard">Dashboard</a>
    <button class="btn" id="btn-new">+ New</button>
</div>
<div class="script-list" id="script-list"></div>
<div class="companion-status" id="companion-bar">
    <span class="status offline" id="companion-dot"></span>
    <span id="companion-text">Companion: checking...</span>
</div>
<script src="popup.js"></script>
</body>
</html>
